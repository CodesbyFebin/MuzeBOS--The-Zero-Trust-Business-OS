name: Bug report
description: Report a reproducible problem using sanitized test data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Do not include secrets, customer records or security exploit details. Use SECURITY.md for private vulnerability reports.
  - type: textarea
    id: environment
    attributes:
      label: Revision and environment
      description: Commit, Node version, OS and browser.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Steps with disposable test records.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
