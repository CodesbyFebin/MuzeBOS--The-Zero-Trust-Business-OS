[package]
name = "agenet-verify"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Independent re-computation of the MuZeBOS evidence hash chain (hash-commitment, not ZK). Derived from AGENeT v2's SHA-256 chain checks."
publish = false

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
path = "src/lib.rs"

[[bin]]
name = "agenet-verify"
path = "src/main.rs"
