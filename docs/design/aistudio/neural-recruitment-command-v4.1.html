        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@500;700&display=swap');
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
          --bg-0:#05070b;--bg-1:#0a0e17;--bg-2:#0f1522;--bg-3:#151d2e;--bg-4:#1c2740;
          --border:#1a2332;--border-hi:#2a3a52;
          --green:#00ff9d;--green-d:#00cc7d;--green-bg:rgba(0,255,157,.07);
          --cyan:#00e5ff;--cyan-bg:rgba(0,229,255,.07);
          --magenta:#ff2d95;--mag-bg:rgba(255,45,149,.07);
          --amber:#ffaa00;--amb-bg:rgba(255,170,0,.07);
          --red:#ff3355;--red-bg:rgba(255,51,85,.07);
          --purple:#a855f7;--pur-bg:rgba(168,85,247,.07);
          --blue:#3b82f6;--blue-bg:rgba(59,130,246,.07);
          --text:#c8d6e5;--text-d:#5a6a80;--text-b:#f1f5f9;
          --mono:'JetBrains Mono',monospace;--sans:'Inter',system-ui,sans-serif;
        }
        html,body{height:100%;overflow:hidden}
        body{font-family:var(--sans);background:var(--bg-0);color:var(--text);font-size:12px;display:flex;flex-direction:column}
        body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 15% 0%,rgba(0,255,157,.06),transparent 55%),radial-gradient(ellipse at 85% 100%,rgba(0,229,255,.05),transparent 55%),radial-gradient(ellipse at 50% 50%,rgba(168,85,247,.03),transparent 70%);pointer-events:none;z-index:0}
        /* Overlays from Nexus */
        #vignette{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,4,10,0.72) 100%)}
        #scanlines{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0.22;background:repeating-linear-gradient(0deg,transparent,transparent 1px,rgba(0,0,0,0.18) 1px,rgba(0,0,0,0.18) 2px)}
        .corner{position:fixed;z-index:5;pointer-events:none;width:36px;height:36px;border-color:rgba(0,229,255,0.28);border-style:solid;border-width:0}
        .corner.tl{top:calc(8px + var(--safe-area-inset-top));left:8px;border-top-width:1.5px;border-left-width:1.5px}
        .corner.tr{top:calc(8px + var(--safe-area-inset-top));right:8px;border-top-width:1.5px;border-right-width:1.5px}
        .corner.bl{bottom:8px;left:8px;border-bottom-width:1.5px;border-left-width:1.5px}
        .corner.br{bottom:8px;right:8px;border-bottom-width:1.5px;border-right-width:1.5px}
        /* TOPBAR */
        .topbar{display:flex;align-items:center;justify-content:space-between;padding:7px 14px;background:rgba(10,14,23,0.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);flex-shrink:0;position:relative;z-index:20;gap:10px}
        .tb-brand{display:flex;align-items:center;gap:9px;flex-shrink:0}
        .tb-logo{width:30px;height:30px;background:linear-gradient(135deg,var(--green),var(--cyan));border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;color:#000;font-family:var(--mono);box-shadow:0 0 18px rgba(0,255,157,.45),0 0 32px rgba(0,229,255,.2)}
        .tb-name{font-size:15px;font-weight:800;color:var(--text-b);letter-spacing:.2px}
        .tb-name .a{color:var(--green);text-shadow:0 0 10px rgba(0,255,157,.6)}
        .tb-sub{font-size:9px;color:var(--text-d);font-family:var(--mono);letter-spacing:1.3px;font-weight:700}
        .tb-ver{font-size:9px;color:var(--green);background:var(--green-bg);padding:3px 8px;border-radius:4px;border:1px solid rgba(0,255,157,.25);font-family:var(--mono);font-weight:700;letter-spacing:.5px}
        .tb-center{display:flex;align-items:center;gap:7px;flex:1;justify-content:center;flex-wrap:wrap}
        .pill{display:flex;align-items:center;gap:5px;padding:3px 9px;background:var(--bg-2);border:1px solid var(--border);border-radius:14px;font-size:10px;font-family:var(--mono);transition:all .25s}
        .pill:hover{border-color:rgba(0,255,157,.3);box-shadow:0 0 12px rgba(0,255,157,.12)}
        .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 2s infinite}
        .dot.cy{background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
        .dot.ma{background:var(--magenta);box-shadow:0 0 6px var(--magenta)}
        .dot.am{background:var(--amber);box-shadow:0 0 6px var(--amber)}
        .dot.rd{background:var(--red);box-shadow:0 0 6px var(--red)}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
        .pill-l{color:var(--text-d);font-size:8px;text-transform:uppercase;letter-spacing:.5px}
        .pill-v{color:var(--text-b);font-weight:600}
        .tb-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
        .tb-btn{background:var(--bg-2);border:1px solid var(--border);color:var(--text-d);padding:4px 9px;border-radius:5px;font-size:10px;font-family:var(--mono);cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:4px;font-weight:600}
        .tb-btn:hover{border-color:var(--green);color:var(--green);background:var(--green-bg);box-shadow:0 0 12px rgba(0,255,157,.15)}
        .tb-btn.on{border-color:var(--green);color:var(--green);background:var(--green-bg)}
        .tb-btn.dng:hover{border-color:var(--red);color:var(--red);background:var(--red-bg)}
        .ub{display:flex;align-items:center;gap:6px;padding:3px 9px;background:var(--bg-2);border:1px solid var(--border);border-radius:5px;font-size:11px;font-family:var(--mono);cursor:pointer}
        .ub .av{width:20px;height:20px;background:linear-gradient(135deg,var(--green),var(--cyan));color:#000;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px}
        /* LAYOUT */
        .app{display:grid;grid-template-columns:200px 1fr 280px;flex:1;overflow:hidden;position:relative;z-index:1;min-height:0}
        /* SIDEBAR */
        .sb{background:rgba(10,14,23,0.96);border-right:1px solid var(--border);padding:10px 0;overflow-y:auto;backdrop-filter:blur(8px)}
        .sb::-webkit-scrollbar{width:4px}.sb::-webkit-scrollbar-thumb{background:var(--border-hi);border-radius:2px}
        .sb-sec{padding:0 8px;margin-bottom:16px}
        .sb-lbl{font-size:8px;color:var(--text-d);text-transform:uppercase;letter-spacing:1.6px;padding:0 8px;margin-bottom:6px;font-weight:800}
        .ni{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:6px;color:var(--text-d);cursor:pointer;transition:all .22s;font-size:11px;font-weight:500;margin-bottom:1px;border:1px solid transparent;position:relative;overflow:hidden}
        .ni::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:transparent;transition:.22s}
        .ni:hover{background:rgba(255,255,255,.03);color:var(--text);border-color:rgba(255,255,255,.04)}
        .ni.on{background:var(--green-bg);color:var(--green);border-color:rgba(0,255,157,.18);box-shadow:0 0 18px rgba(0,255,157,.08),inset 0 0 20px rgba(0,255,157,.03)}
        .ni.on::before{background:var(--green);box-shadow:0 0 8px var(--green)}
        .ni.on-hi{background:linear-gradient(90deg,rgba(0,255,157,.12),rgba(0,255,157,.04));color:#eafff5;border-color:rgba(0,255,157,.35);box-shadow:0 0 22px rgba(0,255,157,.18)}
        .ni .ic{font-size:12px;width:16px;text-align:center;flex-shrink:0}
        .ni .bd{margin-left:auto;font-size:8px;padding:1px 6px;border-radius:4px;background:var(--bg-3);color:var(--text-d);font-family:var(--mono);font-weight:700;letter-spacing:.2px}
        .ni.on .bd{background:rgba(0,255,157,.18);color:var(--green)}
        .ni .bd.rec{color:var(--green);background:rgba(0,255,157,.12);border:1px solid rgba(0,255,157,.18)}
        .ni .bd.hl{background:rgba(255,170,0,.12);color:var(--amber)}
        /* MAIN */
        .main{overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:0;background:linear-gradient(180deg,rgba(10,14,23,.4),transparent)}
        .main::-webkit-scrollbar{width:5px}.main::-webkit-scrollbar-thumb{background:var(--border-hi);border-radius:2px}
        /* KPI */
        .kpi{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
        .kc{background:rgba(10,14,23,.88);border:1px solid var(--border);border-radius:8px;padding:11px;position:relative;overflow:hidden;transition:all .32s;backdrop-filter:blur(8px)}
        .kc:hover{border-color:var(--border-hi);transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,0,0,.35),0 0 18px rgba(0,255,157,.06)}
        .kc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--green),var(--cyan))}
        .kc.cy::before{background:linear-gradient(90deg,var(--cyan),var(--blue))}
        .kc.ma::before{background:linear-gradient(90deg,var(--magenta),var(--purple))}
        .kc.am::before{background:linear-gradient(90deg,var(--amber),var(--red))}
        .kc.pu::before{background:linear-gradient(90deg,var(--purple),var(--magenta))}
        .kc-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
        .kc-l{font-size:8.5px;color:var(--text-d);text-transform:uppercase;letter-spacing:1.1px;font-weight:800}
        .kc-ic{width:24px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;transition:.3s}
        .kc-ic.g{background:var(--green-bg);color:var(--green);box-shadow:0 0 12px rgba(0,255,157,.12)}
        .kc-ic.c{background:var(--cyan-bg);color:var(--cyan)}
        .kc-ic.m{background:var(--mag-bg);color:var(--magenta)}
        .kc-ic.a{background:var(--amb-bg);color:var(--amber)}
        .kc-ic.p{background:var(--pur-bg);color:var(--purple)}
        .kc-v{font-size:18px;font-weight:800;color:var(--text-b);font-family:var(--mono);letter-spacing:-.3px}
        .kc-s{font-size:9px;color:var(--text-d);margin-top:3px;font-family:var(--mono)}
        .kc-s .u{color:var(--green)} .kc-s .d{color:var(--red)}
        /* PANELS */
        .pn{background:rgba(10,14,23,.9);border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;overflow:hidden;backdrop-filter:blur(10px);transition:all .28s}
        .pn:hover{border-color:rgba(0,229,255,.18);box-shadow:0 0 20px rgba(0,229,255,.06),0 8px 24px rgba(0,0,0,.3)}
        .pn-h{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,rgba(255,255,255,.02),transparent);flex-shrink:0}
        .pn-t{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-b);display:flex;align-items:center;gap:6px}
        .pn-t .ic{font-size:12px}
        .pb{font-size:8px;padding:2px 7px;border-radius:4px;font-weight:700;font-family:var(--mono);letter-spacing:.3px}
        .pb-g{background:var(--green-bg);color:var(--green);border:1px solid rgba(0,255,157,.2)}
        .pb-c{background:var(--cyan-bg);color:var(--cyan);border:1px solid rgba(0,229,255,.2)}
        .pb-m{background:var(--mag-bg);color:var(--magenta);border:1px solid rgba(255,45,149,.2)}
        .pb-a{background:var(--amb-bg);color:var(--amber);border:1px solid rgba(255,170,0,.2)}
        .pb-r{background:var(--red-bg);color:var(--red);border:1px solid rgba(255,51,85,.2)}
        .pb-p{background:var(--pur-bg);color:var(--purple);border:1px solid rgba(168,85,247,.2)}
        .pn-b{flex:1;padding:10px 12px;overflow-y:auto;min-height:0}
        .pn-b::-webkit-scrollbar{width:3px}.pn-b::-webkit-scrollbar-thumb{background:var(--border-hi);border-radius:2px}
        .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
        .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
        /* QUEEN TERMINAL */
        .queen-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:8px;background:var(--bg-2);border-radius:6px;border:1px solid var(--border)}
        .queen-avatar{width:32px;height:32px;background:linear-gradient(135deg,var(--magenta),var(--purple));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;box-shadow:0 0 12px rgba(255,45,149,.3)}
        .queen-info{flex:1}
        .queen-name{font-size:12px;font-weight:700;color:var(--text-b)}
        .queen-status{font-size:9px;color:var(--green);font-family:var(--mono);margin-top:1px}
        .queen-mode{font-size:9px;padding:2px 7px;border-radius:3px;background:var(--green-bg);color:var(--green);font-family:var(--mono);font-weight:600}
        .term-output{height:220px;overflow-y:auto;padding:10px;background:var(--bg-0);border:1px solid var(--border);border-radius:5px;font-family:var(--mono);font-size:10px;line-height:1.6;margin-bottom:8px}
        .term-output::-webkit-scrollbar{width:3px}.term-output::-webkit-scrollbar-thumb{background:var(--border-hi);border-radius:2px}
        .tl{margin-bottom:1px;white-space:pre-wrap;word-break:break-word}
        .tl .pr{color:var(--green)}.tl .pu{color:var(--purple)}.tl .cy{color:var(--cyan)}.tl .ma{color:var(--magenta)}.tl .am{color:var(--amber)}.tl .rd{color:var(--red)}.tl .dim{color:var(--text-d)}.tl .bd{font-weight:700;color:var(--text-b)}
        .term-input-wrap{display:flex;align-items:center;gap:6px;padding:7px 10px;background:var(--bg-2);border:1px solid var(--border);border-radius:5px;transition:.2s}
        .term-input-wrap:focus-within{border-color:var(--green);box-shadow:0 0 0 2px rgba(0,255,157,.1)}
        .term-prompt{color:var(--green);font-family:var(--mono);font-size:10px;white-space:nowrap}
        .term-input{flex:1;background:none;border:none;color:var(--text-b);font-family:var(--mono);font-size:10px;outline:none;caret-color:var(--green)}
        /* SWARM CANVAS */
        .swarm-wrap{position:relative;height:160px;margin-bottom:8px;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:radial-gradient(ellipse at center,rgba(0,255,157,.04),transparent 70%),var(--bg-0)}
        /* AGENT LIST */
        .ag-l{display:flex;flex-direction:column;gap:4px}
        .ar{display:flex;align-items:center;gap:8px;padding:7px 8px;background:var(--bg-2);border:1px solid var(--border);border-radius:5px;cursor:pointer;transition:all .22s}
        .ar:hover{border-color:var(--border-hi);transform:translateX(1px)}
        .ar.on{border-color:var(--green);background:var(--green-bg);box-shadow:0 0 12px rgba(0,255,157,.12)}
        .ar-d{width:7px;height:7px;border-radius:50%;flex-shrink:0}
        .ar-d.g{background:var(--green);box-shadow:0 0 6px var(--green)}
        .ar-d.c{background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
        .ar-d.m{background:var(--magenta);box-shadow:0 0 6px var(--magenta)}
        .ar-d.a{background:var(--amber);box-shadow:0 0 6px var(--amber)}
        .ar-n{font-size:10.5px;font-weight:600;color:var(--text-b);flex:1}
        .ar-t{font-size:8px;color:var(--text-d);font-family:var(--mono)}
        /* JEV GATE */
        .jev-gate{padding:10px;background:var(--bg-2);border:1px solid rgba(255,170,0,.22);border-radius:6px;margin-bottom:8px}
        .jev-title{font-size:10px;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
        .jev-queue{display:flex;flex-direction:column;gap:4px}
        .jev-item{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--bg-1);border:1px solid var(--border);border-radius:5px;font-size:9px;transition:.2s;min-width:0;flex-wrap:wrap}
        .jev-item:hover{border-color:rgba(255,170,0,.25)}
        .jev-item .jid{font-family:var(--mono);color:var(--text-b);font-weight:600;min-width:68px;flex-shrink:0}
        .jev-item .jfrom{color:var(--text-d);flex:1 1 120px;min-width:0;font-family:var(--mono);font-size:8.5px;word-break:break-word;white-space:normal;line-height:1.3}
        .jev-item .jstatus{padding:1px 6px;border-radius:3px;font-weight:700;font-family:var(--mono);font-size:8px;flex-shrink:0}
        .jev-item .jstatus.pending{background:var(--amb-bg);color:var(--amber)}
        .jev-item .jstatus.approved{background:var(--green-bg);color:var(--green)}
        .jev-item .jstatus.rejected{background:var(--red-bg);color:var(--red)}
        /* RESOURCES */
        .pr{display:flex;align-items:center;gap:8px;margin-bottom:6px}
        .pr-l{font-size:8px;color:var(--text-d);width:62px;flex-shrink:0;font-family:var(--mono);text-transform:uppercase;letter-spacing:.6px}
        .pr-b{flex:1;height:5px;background:var(--bg-3);border-radius:3px;overflow:hidden}
        .pr-f{height:100%;border-radius:3px;transition:width .6s}
        .pr-f.g{background:linear-gradient(90deg,var(--green-d),var(--green))}
        .pr-f.c{background:linear-gradient(90deg,#00b8d4,var(--cyan))}
        .pr-f.m{background:linear-gradient(90deg,#d4006a,var(--magenta))}
        .pr-f.a{background:linear-gradient(90deg,#cc8800,var(--amber))}
        .pr-v{font-size:8.5px;color:var(--text-b);font-family:var(--mono);width:36px;text-align:right;flex-shrink:0;font-weight:700}
        /* FEED */
        .feed-tabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
        .ftab{padding:4px 10px;border-radius:14px;border:1px solid var(--border);background:var(--bg-2);color:var(--text-d);font-size:9px;font-family:var(--mono);font-weight:700;cursor:pointer;transition:.2s;letter-spacing:.3px}
        .ftab:hover{color:var(--text);border-color:var(--border-hi)}
        .ftab.on{background:var(--green-bg);color:var(--green);border-color:rgba(0,255,157,.3);box-shadow:0 0 12px rgba(0,255,157,.12)}
        .feed-l{display:flex;flex-direction:column;gap:2px}
        .fi{display:flex;gap:7px;padding:7px 8px;font-size:9.5px;border-bottom:1px solid rgba(255,255,255,.03);border-radius:4px;transition:.18s;cursor:pointer}
        .fi:hover{background:rgba(255,255,255,.02);border-color:rgba(255,255,255,.06)}
        .fi-t{color:var(--text-d);font-family:var(--mono);font-size:8px;flex-shrink:0;min-width:46px;margin-top:2px}
        .fi-tag{font-size:7.5px;padding:2px 5px;border-radius:3px;font-weight:800;font-family:var(--mono);flex-shrink:0;height:fit-content;margin-top:1px;letter-spacing:.4px}
        .fi-tag.SOURCING{background:var(--green-bg);color:var(--green);border:1px solid rgba(0,255,157,.18)}
        .fi-tag.MATCHING{background:var(--cyan-bg);color:var(--cyan);border:1px solid rgba(0,229,255,.18)}
        .fi-tag.OUTREACH{background:var(--mag-bg);color:var(--magenta);border:1px solid rgba(255,45,149,.18)}
        .fi-tag.PIPELINE{background:var(--amb-bg);color:var(--amber);border:1px solid rgba(255,170,0,.18)}
        .fi-tag.PLACEMENT{background:var(--pur-bg);color:var(--purple);border:1px solid rgba(168,85,247,.18)}
        .fi-tag.SYSTEM{background:var(--bg-3);color:var(--text-d);border:1px solid var(--border)}
        .fi-msg{color:var(--text);flex:1;line-height:1.45}
        .fi-msg b{color:var(--text-b);font-weight:700}
        .fi-detail{color:var(--text-d);font-family:var(--mono);font-size:8.5px;margin-top:2px}
        /* RIGHT */
        .rp{background:rgba(10,14,23,.96);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;backdrop-filter:blur(10px)}
        .rp::-webkit-scrollbar{width:3px}.rp::-webkit-scrollbar-thumb{background:var(--border-hi);border-radius:2px}
        .rs{padding:11px 12px;border-bottom:1px solid var(--border);transition:.22s}
        .rs:hover{border-color:rgba(0,229,255,.12);background:rgba(255,255,255,.01)}
        .rs:last-child{border-bottom:none}
        .rs-t{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
        .rs-t h4{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:1.3px;color:var(--text-b);display:flex;align-items:center;gap:6px}
        .ms{width:100%;padding:6px 8px;background:var(--bg-2);border:1px solid var(--border);border-radius:5px;color:var(--text-b);font-family:var(--mono);font-size:10px;cursor:pointer;outline:none;margin-bottom:8px;transition:.2s}
        .ms:focus{border-color:var(--green)}
        .model-row{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:4px;background:var(--bg-2);border:1px solid var(--border);margin-bottom:4px;transition:.2s}
        .model-row:hover{border-color:rgba(0,229,255,.25);box-shadow:0 0 12px rgba(0,229,255,.08)}
        .model-row.on{border-color:var(--green);background:var(--green-bg)}
        .model-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
        .model-name{flex:1;color:var(--text-b);font-weight:600;font-size:10px}
        .model-provider{color:var(--text-d);font-size:8px;font-family:var(--mono)}
        .model-lat{font-size:8px;color:var(--cyan);font-family:var(--mono);font-weight:700}
        .model-tok{font-size:8px;color:var(--text-d);font-family:var(--mono)}
        .qa{display:grid;grid-template-columns:1fr 1fr;gap:4px}
        .qa-b{padding:7px 5px;background:var(--bg-2);border:1px solid var(--border);border-radius:5px;color:var(--text);font-family:var(--mono);font-size:8px;font-weight:700;cursor:pointer;transition:all .22s;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}
        .qa-b:hover{border-color:var(--green);color:var(--green);background:var(--green-bg);box-shadow:0 0 12px rgba(0,255,157,.12);transform:translateY(-1px)}
        .qa-b .qi{font-size:13px}
        .sess{font-family:var(--mono);font-size:9px;line-height:1.8}
        .sess-r{display:flex;justify-content:space-between}
        .sess-k{color:var(--text-d)} .sess-v{color:var(--text-b)}
        /* PIPELINE KANBAN */
        .kanban{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;min-height:520px}
        .kan-col{background:rgba(10,14,23,.85);border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;overflow:hidden}
        .kan-h{padding:9px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg-2)}
        .kan-h-title{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--text-b);font-family:var(--mono)}
        .kan-h-count{font-size:9px;padding:2px 6px;border-radius:10px;background:var(--bg-3);color:var(--text-d);font-family:var(--mono);font-weight:700}
        .kan-body{padding:6px;display:flex;flex-direction:column;gap:6px;overflow-y:auto;flex:1}
        .kan-body::-webkit-scrollbar{width:3px}.kan-body::-webkit-scrollbar-thumb{background:var(--border-hi);border-radius:2px}
        .kcard{background:var(--bg-1);border:1px solid var(--border);border-radius:6px;padding:8px;transition:.22s;cursor:pointer;position:relative;overflow:hidden}
        .kcard:hover{border-color:var(--green);transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.4),0 0 14px rgba(0,255,157,.08)}
        .kcard-top{display:flex;align-items:center;gap:7px;margin-bottom:6px}
        .kcard-av{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#000;font-family:var(--mono);flex-shrink:0}
        .kcard-name{font-size:10.5px;font-weight:700;color:var(--text-b);line-height:1.1}
        .kcard-role{font-size:8px;color:var(--text-d);font-family:var(--mono);margin-top:1px}
        .kcard-match{margin-left:auto;width:28px;height:28px;border-radius:50%;border:2px solid var(--green);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:var(--green);font-family:var(--mono);background:var(--green-bg)}
        .kcard-foot{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
        .kcard-next{font-size:7px;padding:2px 6px;border-radius:10px;background:var(--cyan-bg);color:var(--cyan);border:1px solid rgba(0,229,255,.2);font-family:var(--mono);font-weight:700}
        .kcard-salary{font-size:8px;color:var(--text-d);font-family:var(--mono)}
        /* RESUME HUD */
        .resume-hud{background:rgba(10,14,23,.92);border:1px solid var(--border);border-radius:10px;overflow:hidden}
        .resume-hdr{padding:18px 20px;border-bottom:1px solid var(--border);background:linear-gradient(90deg,rgba(0,255,157,.06),transparent 60%),var(--bg-1);display:flex;gap:16px;align-items:center}
        .resume-av{width:64px;height:64px;border-radius:12px;background:linear-gradient(135deg,var(--green),var(--cyan));display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:#000;box-shadow:0 0 24px rgba(0,255,157,.35)}
        .resume-name{font-size:22px;font-weight:900;color:var(--text-b);letter-spacing:-.5px}
        .resume-title{font-size:12px;color:var(--green);font-family:var(--mono);font-weight:700;margin-top:3px}
        .resume-meta{font-size:10px;color:var(--text-d);font-family:var(--mono);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
        .resume-body{padding:16px 20px;display:grid;grid-template-columns:1fr 300px;gap:18px}
        .resume-section{margin-bottom:18px}
        .resume-sec-title{font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--cyan);margin-bottom:8px;display:flex;align-items:center;gap:6px}
        .resume-text{font-size:11px;line-height:1.6;color:var(--text);font-family:var(--sans)}
        .resume-skill-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
        .skill-row{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;background:var(--bg-2);border:1px solid var(--border);border-radius:5px}
        .skill-name{font-size:10px;font-weight:600;color:var(--text-b);font-family:var(--mono)}
        .skill-level{font-size:8px;padding:2px 6px;border-radius:10px;background:var(--green-bg);color:var(--green);font-family:var(--mono);font-weight:700}
        .proj-card{padding:10px;background:var(--bg-2);border:1px solid var(--border);border-radius:6px;margin-bottom:8px;transition:.2s}
        .proj-card:hover{border-color:rgba(0,255,157,.25)}
        .proj-name{font-size:11px;font-weight:700;color:var(--text-b)}
        .proj-desc{font-size:9.5px;color:var(--text-d);margin-top:3px;line-height:1.5;font-family:var(--mono)}
        .highlight-box{padding:12px;background:linear-gradient(135deg,rgba(0,255,157,.08),rgba(0,229,255,.05));border:1px solid rgba(0,255,157,.2);border-radius:8px;margin-top:10px}
        .highlight-q{font-size:10px;font-weight:800;color:var(--green);font-family:var(--mono);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
        .highlight-a{font-size:11px;line-height:1.6;color:var(--text-b)}
        /* TOAST */
        .toast{position:fixed;bottom:16px;right:16px;padding:10px 14px;background:rgba(15,21,34,.96);border:1px solid var(--green);border-radius:7px;color:var(--green);font-size:11px;font-family:var(--mono);font-weight:700;display:flex;align-items:center;gap:8px;transform:translateY(90px);opacity:0;transition:all .35s cubic-bezier(.16,1,.3,1);z-index:10000;box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 20px rgba(0,255,157,.15);backdrop-filter:blur(12px)}
        .toast.show{transform:translateY(0);opacity:1}
        .toast.w{border-color:var(--amber);color:var(--amber);box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 20px rgba(255,170,0,.15)}
        .toast.e{border-color:var(--red);color:var(--red)}
        .toast.i{border-color:var(--cyan);color:var(--cyan)}
        /* BOOT */
        #boot-screen{position:fixed;inset:0;z-index:9999;background:#05070b;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity .9s cubic-bezier(.16,1,.3,1)}
        #boot-screen.hidden{opacity:0;pointer-events:none}
        #boot-canvas{position:absolute;inset:0;opacity:.3}

        @keyframes bootPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
        .boot-title{position:relative;z-index:2;font-family:var(--mono);font-size:1.8rem;font-weight:800;color:var(--text-b);letter-spacing:.15em;margin-top:18px;text-shadow:0 0 24px rgba(0,255,157,.4)}
        .boot-title .a{color:var(--green)}
        .boot-sub{position:relative;z-index:2;font-size:.75rem;color:var(--text-d);margin-top:8px;letter-spacing:.25em;font-family:var(--mono)}
        .boot-bar{position:relative;z-index:2;width:280px;height:3px;background:rgba(255,255,255,.06);margin-top:22px;border-radius:3px;overflow:hidden;border:1px solid rgba(255,255,255,.06)}
        .boot-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));box-shadow:0 0 12px var(--green);transition:width .15s}
        .boot-pct{position:relative;z-index:2;font-family:var(--mono);font-size:10px;color:var(--green);margin-top:8px;letter-spacing:1px}
        /* THOUGHT STREAM */
        #thought-stream{position:fixed;bottom:18px;left:212px;max-width:360px;z-index:12;font-size:9px;line-height:1.6;color:rgba(200,214,229,.7);pointer-events:none;background:rgba(10,14,23,.75);padding:7px 10px;border-left:2px solid var(--green);backdrop-filter:blur(8px);border-radius:0 6px 6px 0;box-shadow:0 4px 16px rgba(0,0,0,.4)}
        #thought-stream .ts-label{color:var(--green);font-size:8px;font-weight:800;letter-spacing:1.2px;margin-bottom:4px;text-shadow:0 0 6px rgba(0,255,157,.5);display:flex;justify-content:space-between}
        .ts-step{margin:1px 0;opacity:.9;font-family:var(--mono)}
        .ts-step .hl{color:var(--amber);font-weight:700}
        /* Responsive - prevent horizontal overflow */
        .app,.main,.pn,.kpi,.kanban,.g2,.g3{ min-width:0; }
        .topbar,.tb-center{ min-width:0; }
        .topbar{ flex-wrap:wrap; overflow-x:clip; }

        @media(max-width:1300px){.app{grid-template-columns:180px minmax(0,1fr) 250px}.kpi{grid-template-columns:repeat(3,minmax(0,1fr))}.kanban{grid-template-columns:repeat(3,minmax(0,1fr))}.resume-body{grid-template-columns:1fr}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
        @media(max-width:900px){
          html,body{overflow:auto}
          .app{grid-template-columns:minmax(0,1fr);display:flex;flex-direction:column;overflow:visible}
          .sb,.rp{display:none}
          .main{overflow:visible;padding:10px;gap:10px}
          .g2,.g3{grid-template-columns:minmax(0,1fr);gap:10px}
          .kpi{grid-template-columns:minmax(0,1fr);gap:8px}
          .kanban{grid-template-columns:minmax(0,1fr);gap:8px;min-height:auto}
          .kan-col{overflow:visible}
          .resume-body{grid-template-columns:minmax(0,1fr);gap:12px}
          .resume-hdr{flex-direction:column;align-items:flex-start}
          .topbar{padding:8px 10px;gap:8px;position:relative;top:auto !important}
          .tb-brand{flex-wrap:wrap}
          .tb-center{width:100%;order:3;justify-content:flex-start;gap:5px}
          .tb-right{width:100%;order:2;justify-content:flex-start;flex-wrap:wrap}
          .pill{font-size:9px;padding:2px 7px}
          #thought-stream{left:10px;right:10px;max-width:none;bottom:10px;position:relative;transform:none;margin:10px}
          .fi{flex-wrap:wrap}
          .swarm-wrap{height:180px}
          .term-output{height:180px}
        }
        @media(max-width:390px){
          .kpi{grid-template-columns:minmax(0,1fr)}
          .kanban{grid-template-columns:minmax(0,1fr)}
          .resume-skill-grid{grid-template-columns:minmax(0,1fr)}
        }
